<svg xmlns="http://www.w3.org/2000/svg" id="active" width="256" height="256" viewBox="0 0 256 256">
  <style>
    .head { transform-origin: 128px 190px; }
    .arm { transform-origin: 190px 207px; }
    #active:target .head { animation: look 650ms ease-out 160ms, nod 4s ease-in-out 810ms infinite; }
    #active:target .arm { animation: wave 650ms ease-out 160ms; }
    #active:target .eyes { animation: blink 3.5s ease-in-out infinite; }
    @keyframes look { 30% { transform: rotate(-9deg); } 65% { transform: rotate(7deg); } }
    @keyframes nod { 50% { transform: rotate(-3deg) translateY(2px); } }
    @keyframes wave { 25%, 65% { transform: rotate(28deg); } 45% { transform: rotate(12deg); } }
    @keyframes blink { 45% { opacity: 1; } 48% { opacity: .25; } 51% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g stroke="#735329" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <g class="arm">
