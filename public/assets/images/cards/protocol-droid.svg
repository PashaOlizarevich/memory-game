    <path fill="#FFE36B" d="M85 77q5-21 43-21t43 21v12H85Z" stroke="none"/>
    <circle cx="99" cy="110" r="19" fill="#735329"/>
    <circle cx="157" cy="110" r="19" fill="#735329"/>
