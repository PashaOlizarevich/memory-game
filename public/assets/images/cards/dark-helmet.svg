    <path fill="#070B14" d="m90 116 29 9-8 20-24-9Zm76 0-29 9 8 20 24-9Z"/>
    <path class="glint" fill="none" stroke="#FF9CA8" stroke-width="4" d="m94 124 16 5m35 0 16-5"/>
    <path fill="#070B14" d="m128 143-26 43h52Z"/>
    <path fill="none" stroke-width="5" d="M120 161v21m16-21v21m-8-142v55"/>
    <circle cx="93" cy="169" r="7" fill="#AEBBD0" stroke="none"/>
    <circle cx="163" cy="169" r="7" fill="#AEBBD0" stroke="none"/>
  </g>
