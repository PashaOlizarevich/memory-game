<svg xmlns="http://www.w3.org/2000/svg" id="active" width="256" height="256" viewBox="0 0 256 256">
  <style>
    .helmet { transform-origin: 128px 190px; }
    .glint { opacity: 0; }
    #active:target .helmet { animation: turn 650ms ease-out 160ms, breathe 3.5s ease-in-out 810ms infinite; }
    #active:target .glint { animation: sweep 650ms ease-out 160ms, sweep 4.5s ease-out 2s infinite; }
    @keyframes turn { 35% { transform: rotate(10deg) scale(1.06); } 70% { transform: rotate(-5deg); } }
    @keyframes breathe { 50% { transform: translateY(-2px) scale(1.025); } }
    @keyframes sweep { 10% { opacity: 0; transform: translateX(-8px); } 40% { opacity: .8; } 80%, 100% { opacity: 0; transform: translateX(8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="helmet">
  <g stroke="#AEBBD0" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
