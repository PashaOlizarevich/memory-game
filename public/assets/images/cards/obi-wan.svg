<svg id="active" xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <style>
    .portrait { transform-origin: 128px 210px; }
    .detail { transform-origin: 128px 145px; }
    #active:target .portrait { animation: reveal 560ms ease-out 160ms both; }
    #active:target .detail { animation: gesture 5240ms ease-in-out 720ms infinite; }
