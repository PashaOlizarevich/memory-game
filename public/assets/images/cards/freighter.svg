<svg xmlns="http://www.w3.org/2000/svg" id="active" width="256" height="256" viewBox="0 0 256 256">
  <style>
    .ship { transform-origin: 128px 128px; }
    .trail { opacity: 0; }
    #active:target .ship { animation: jump 650ms ease-out 160ms, hover 3.5s ease-in-out 810ms infinite; }
    #active:target .trail { animation: trail 650ms ease-out 160ms; }
    #active:target .engine { animation: thrust 1.6s ease-in-out infinite; }
    @keyframes jump { 25% { transform: rotate(-14deg) translateY(6px) scale(.9); } 60% { transform: rotate(10deg) translateY(-10px) scale(1.06); } }
    @keyframes hover { 50% { transform: translateY(-4px) rotate(-3deg); } }
    @keyframes trail { 30% { opacity: 0; } 55% { opacity: .8; } 100% { opacity: 0; transform: translateY(14px); } }
    @keyframes thrust { 50% { stroke: #F4F7FC; stroke-width: 12; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
