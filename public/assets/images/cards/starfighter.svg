    <path fill="#F4F7FC" d="m128 36 21 94-8 69h-26l-8-69Z"/>
    <path fill="#75DAFF" d="m128 90 11 44h-22Z"/>
    <path fill="#1B2940" d="M115 161h26v25h-26Z"/>
    <g class="engine">
      <path d="M128 204v28" stroke="#FF9CA8" stroke-width="17" opacity=".3"/>
      <path d="M128 204v22" stroke="#FF9CA8" stroke-width="9"/>
      <path d="M128 204v12" stroke="#FFE36B" stroke-width="4"/>
    </g>
    <path fill="#F4F7FC" d="M75 91h16v30H75Zm90 0h16v30h-16Zm-90 56h16v30H75Zm90 0h16v30h-16Z"/>
  </g>
  </g>
</svg>
