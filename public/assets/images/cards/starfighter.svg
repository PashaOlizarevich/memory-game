<svg xmlns="http://www.w3.org/2000/svg" id="active" width="256" height="256" viewBox="0 0 256 256">
  <style>
    .ship { transform-origin: 128px 128px; }
    .engine { transform-origin: 128px 204px; }
    #active:target .ship { animation: launch 650ms ease-out 160ms, hover 3s ease-in-out 810ms infinite; }
    #active:target .engine { animation: ignition 650ms ease-out 160ms, thrust 1.4s ease-in-out 810ms infinite; }
    @keyframes launch { 25% { transform: translateY(8px) rotate(-12deg) scale(.92); } 60% { transform: translateY(-12px) rotate(8deg) scale(1.06); } }
    @keyframes hover { 50% { transform: translateY(-5px) rotate(3deg); } }
    @keyframes ignition { 35% { transform: scaleY(.4); } 60% { transform: scaleY(1.6); } }
    @keyframes thrust { 50% { transform: scaleY(1.3); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g class="ship">
  <g stroke="#354760" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
